[project]
name = "soccer-scraper"
version = "0.1.0"
description = "Scrapping results and attendance data for multiple soccer matches from different leagues."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "beautifulsoup4>=4.13.4",
    "fuzzywuzzy>=0.18.0",
    "ipykernel>=6.30.1",
    "lxml>=5.0.0",
    "matplotlib>=3.10.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.1",
    "python-levenshtein>=0.27.1",
    "requests>=2.32.4",
    "scipy>=1.16.2",
    "seaborn>=0.13.2",
    "thefuzz>=0.22.1",
    "xlrd>=2.0.2",
]
